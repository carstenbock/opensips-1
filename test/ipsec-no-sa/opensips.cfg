# Minimal IPsec gateway for test/ipsec-no-sa/run.sh. No UE has a set of SAs.
# static_policies 0: without static policies nothing in the kernel stops a
# clear-text packet from the protected ports, so only proto_ipsec decides
# (the setup in which KI-69 leaked).
#   X-Dir: to-ue   request from the core (plain socket), relayed towards the
#                  UE through the protected server port, as network_to_ue does
#   X-Dir: to-core request from a UE (protected server port), relayed to the
#                  core through the same socket, like the KI-118 strict-route
#                  sends of the gateway
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:172.30.98.10:5060
socket=ipsec:172.30.98.10:5100,5101

loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "usrloc.so"
loadmodule "proto_ipsec.so"

modparam("usrloc", "working_mode_preset", "single-instance-no-db")
modparam("proto_ipsec", "default_client_port", 5101)
modparam("proto_ipsec", "default_server_port", 5100)
modparam("proto_ipsec", "static_policies", 0)
modparam("tm", "fr_timeout", 3)

route {
	if ($hdr(X-Dir) == "to-ue") {
		$du = "sip:172.30.98.1:5080";
	} else if ($hdr(X-Dir) == "to-core") {
		$du = "sip:172.30.98.1:5070";
	} else {
		sl_send_reply(400, "No X-Dir");
		exit;
	}
	$socket_out = "udp:172.30.98.10:5100";
	t_relay();
	exit;
}
