# Minimal S-CSCF registrar for test/auth-aka-mar-error/run.sh: challenges
# every REGISTER with async(aka_www_challenge()) against the fake HSS of
# fake_hss.py. run.sh sets AV_FAILURE_REPLY (1 = module default, 0 = the
# script answers a failed MAR). The reason phrases carry the return code for
# check.py.
log_level=3
stderror_enabled=yes
udp_workers=2
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:127.0.0.1:5179

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "sipmsgops.so"
loadmodule "tm.so"
loadmodule "auth.so"
loadmodule "aaa_diameter.so"
loadmodule "auth_aka.so"
loadmodule "aka_av_diameter.so"

modparam("aaa_diameter", "realm", "test")
modparam("aaa_diameter", "peer_identity", "hss.test")
modparam("aaa_diameter", "aaa_url",
	"diameter:/etc/opensips/freeDiameter.conf;extra-avps-file:/etc/opensips/scscf.dictionary")
modparam("auth_aka", "default_av_mgm", "diameter")
# longer than the Diameter answer timeout (2 s), so "silent" fails through the
# Diameter timeout: 500 from the module with the default, 504 from the script
modparam("auth_aka", "async_timeout", 4000)
modparam("auth_aka", "av_failure_reply", AV_FAILURE_REPLY)
modparam("aka_av_diameter", "realm", "test")
modparam("aka_av_diameter", "origin_host", "scscf.test")
modparam("aka_av_diameter", "aaa_url",
	"diameter:/etc/opensips/freeDiameter.conf;extra-avps-file:/etc/opensips/scscf.dictionary")

route {
	if (!is_method("REGISTER")) {
		sl_send_reply(405, "Method Not Allowed");
		exit;
	}
	if (!aka_www_authorize()) {
		if (!async(aka_www_challenge(), mar_done))
			t_reply(500, "Early async failed");
		exit;
	}
	exit;
}

route[mar_done] {
	$var(rc) = $rc;
	if ($var(rc) == -7 && $aka_mar_exp_rc == 5001)
		t_reply(403, "Forbidden rc=$var(rc) exp=$aka_mar_exp_rc");
	else if ($var(rc) == -8)
		t_reply(504, "Server Time-out rc=$var(rc)");
	else if ($var(rc) == -7)
		t_reply(500, "Server Internal Error rc=$var(rc) mar=$aka_mar_rc exp=$aka_mar_exp_rc");
	else if ($var(rc) < 0)
		t_reply(500, "Early rc=$var(rc)");
}
