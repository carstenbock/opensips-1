# Minimal config for test/rtpengine-flags/run.sh: every INVITE is offered to
# the fake RTPEngine with a flag string held in a script variable, as the
# P-CSCF does in route[mt_af_check].
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:127.0.0.1:5099

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22299")

route {
	$var(af) = "IP6";
	$var(f) = "in-iface=internal out-iface=internal address-family=" + $var(af) + " replace-origin";
	$var(f) = $var(f) + " codec-strip-all codec-except-AMR codec-except-AMR-WB codec-except-EVS codec-except-telephone-event";
	# A long value makes the freed copy big enough for the next allocation
	# (the bencode iovec) to reuse it, as in a long-running worker.
	$var(f) = $var(f) + " ";
	if (rtpengine_offer($var(f), , $var(body))) {
		sl_send_reply(200, "OK");
	} else {
		sl_send_reply(500, "Offer Failed");
	}
	exit;
}
