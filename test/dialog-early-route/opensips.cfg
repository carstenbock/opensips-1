# Minimal proxy for test/dialog-early-route/run.sh: record-routes and creates
# a dialog for every INVITE, and PRACKs a reliable 183 toward the callee with
# dlg_send_sequential(), as the P-CSCF does for its local precondition handling.
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:127.0.0.1:5199

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "sipmsgops.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "dialog.so"

route {
	if (is_method("INVITE") && !has_totag()) {
		record_route();
		create_dialog();
		t_on_reply("invite_reply");
		$du = "sip:127.0.0.1:5198";
		t_relay();
	}
	exit;
}

onreply_route[invite_reply] {
	if ($rs == 183) {
		$var(rack) = "RAck: " + $hdr(RSeq) + " " + $hdr(CSeq) + "\r\n";
		dlg_send_sequential("PRACK", "callee", , , $var(rack));
	}
}
