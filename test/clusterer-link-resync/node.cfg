# usrloc full-sharing node for test/clusterer-link-resync/run.sh. run.sh
# replaces the upper-case placeholders MY_ID, MY_IP, PEER_ID, PEER_IP.
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=bin:MY_IP:5566

loadmodule "proto_bin.so"
loadmodule "mi_fifo.so"
loadmodule "clusterer.so"
loadmodule "usrloc.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "registrar.so"

modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")
modparam("clusterer", "db_mode", 0)
modparam("clusterer", "my_node_id", MY_ID)
modparam("clusterer", "my_node_info", "cluster_id=1, url=bin:MY_IP:5566")
modparam("clusterer", "neighbor_node_info", "cluster_id=1, node_id=PEER_ID, url=bin:PEER_IP:5566")
modparam("clusterer", "ping_interval", 1)
modparam("clusterer", "ping_timeout", 500)
modparam("clusterer", "node_timeout", 2)
modparam("usrloc", "cluster_mode", "full-sharing")
modparam("usrloc", "location_cluster", 1)

# lookup() makes registrar register the "location" table that MI ul_add
# writes to
route {
	if ($rm == "REGISTER")
		lookup("location");
	exit;
}
