# Minimal IPsec gateway for test/ipsec-tcp-reconnect/run.sh (KI-150).
# REGISTER: relayed to the core; ipsec_create() on the 401 builds the set of
# SAs (a temporary set is enough to send to the UE).
# Any other request comes from the core and goes to the UE over TCP inside
# the SAs, with the UDP retry of the IPsec GW chart (route[relay]): a send
# that fails at once is retried over UDP (RFC 3261 18.1.1).
# tcp_connection_lifetime 2: the gateway closes the idle connection itself
# and keeps its TIME_WAIT, as with the chart's idle connections.
log_level=3
stderror_enabled=yes
udp_workers=2
tcp_connection_lifetime=2
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:172.30.96.10:5060
socket=ipsec:172.30.96.10:5100,5101

loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "usrloc.so"
loadmodule "proto_ipsec.so"

modparam("usrloc", "working_mode_preset", "single-instance-no-db")
modparam("proto_ipsec", "default_client_port", 5101)
modparam("proto_ipsec", "default_server_port", 5100)
modparam("proto_ipsec", "temporary_timeout", 120)
modparam("tm", "fr_timeout", 4)
modparam("tm", "onreply_avp_mode", 1)

route {
	if ($rm == "REGISTER") {
		$du = "sip:172.30.96.20:5070";
		t_on_reply("reg");
		t_relay();
		exit;
	}
	$du = "sip:172.30.96.20:6201;transport=tcp";
	$socket_out = "tcp:172.30.96.10:5100";
	# Since the merge with upstream 4.1 a TCP send is queued and the connect
	# is done by the TCP main process: a failed connect does not make
	# t_relay() fail, the branch gets a 477 instead, and the retry over UDP
	# is done in the failure route (as in the gateway chart). The branch
	# below still covers a send that fails at once.
	t_on_failure("udp_fallback");
	if (t_relay("no-auto-477"))
		exit;
	xlog("L_WARN", "[$ci] TCP send towards UE failed - falling back to UDP\n");
	$du = "sip:172.30.96.20:6201;transport=udp";
	$socket_out = "udp:172.30.96.10:5100";
	if (!t_relay())
		send_reply(500, "Internal Error");
	exit;
}

failure_route[udp_fallback] {
	if (t_check_status("477")) {
		xlog("L_WARN", "[$ci] TCP towards UE failed (477) - falling back to UDP\n");
		$du = "sip:172.30.96.20:6201;transport=udp";
		$socket_out = "udp:172.30.96.10:5100";
		t_relay();
	}
}

onreply_route[reg] {
	if ($rs == 401)
		ipsec_create();
}
