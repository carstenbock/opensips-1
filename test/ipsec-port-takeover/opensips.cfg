# Minimal IPsec gateway for test/ipsec-port-takeover/run.sh (helm KI-248).
# REGISTER: relayed to the core; ipsec_create() on the 401 builds a temporary
# set of SAs and adds Security-Server. A 401 that got no set is answered
# with 500, as the IPsec GW chart does (failure_route[register_failure]).
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:172.30.95.10:5060
socket=ipsec:172.30.95.10:5100,5101

loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "usrloc.so"
loadmodule "proto_ipsec.so"

modparam("usrloc", "working_mode_preset", "single-instance-no-db")
modparam("proto_ipsec", "default_client_port", 5101)
modparam("proto_ipsec", "default_server_port", 5100)
modparam("proto_ipsec", "temporary_timeout", 120)
modparam("tm", "fr_timeout", 4)
modparam("tm", "onreply_avp_mode", 1)

route {
	if ($rm != "REGISTER") {
		sl_send_reply(405, "Method Not Allowed");
		exit;
	}
	$du = "sip:172.30.95.1:5070";
	t_on_reply("reg");
	t_on_failure("reg");
	t_relay();
	exit;
}

onreply_route[reg] {
	if ($rs == 401 && !ipsec_create())
		$avp(sa_refused) = 1;
}

failure_route[reg] {
	if ($avp(sa_refused) == 1) {
		t_reply(500, "Server Internal Error");
		exit;
	}
}
