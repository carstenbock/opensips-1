# Behaviour test for KI-190: the registrar takes the GRUU host from the
# gruu_domain_avp AVP when it is set, and from gruu_domain otherwise.
# REGISTER is handled as in route[aka_resume_sar] of the S-CSCF chart: a
# save() per identity without a reply, then the final save(). The UE in
# check.py sends X-Home-Domain to stand for the domain the S-CSCF takes from
# the identity being saved; without it the AVP stays unset.

log_level = 3
stderror_enabled = yes
syslog_enabled = no
udp_workers = 2

socket = udp:127.0.0.1:5470

mpath = "/usr/lib/x86_64-linux-gnu/opensips/modules"

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("registrar", "disable_gruu", 0)
modparam("registrar", "gruu_secret", "0123456789abcdef")
modparam("registrar", "gruu_domain", "platform.test")
modparam("registrar", "gruu_domain_avp", "$avp(gruu_domain)")

route {
	if ($rm != "REGISTER") {
		sl_send_reply(405, "Method Not Allowed");
		exit;
	}
	if ($hdr(X-Home-Domain) != NULL)
		$avp(gruu_domain) = $hdr(X-Home-Domain);
	save("location", "no-reply, max-contacts=1, force-registration, store-gruu", "sip:$tU@$td");
	if (!save("location", "max-contacts=1, force-registration, store-gruu")) {
		sl_send_reply(500, "save failed");
		exit;
	}
	exit;
}
