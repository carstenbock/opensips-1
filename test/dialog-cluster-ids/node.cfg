# Dialog replication node for test/dialog-cluster-ids/run.sh. run.sh replaces
# the upper-case placeholders MY_ID, MY_IP, PEER_ID, PEER_IP and UAS.
# In-dialog requests are checked as in the P-CSCF: a request whose dialog is
# not found gets 481.
log_level=3
stderror_enabled=yes
udp_workers=2
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:MY_IP:5060
socket=bin:MY_IP:5566

loadmodule "proto_udp.so"
loadmodule "proto_bin.so"
loadmodule "mi_fifo.so"
loadmodule "clusterer.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "sipmsgops.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "dialog.so"

modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")
modparam("clusterer", "db_mode", 0)
modparam("clusterer", "my_node_id", MY_ID)
modparam("clusterer", "my_node_info", "cluster_id=1, url=bin:MY_IP:5566")
modparam("clusterer", "neighbor_node_info", "cluster_id=1, node_id=PEER_ID, url=bin:PEER_IP:5566")
modparam("clusterer", "ping_interval", 1)
modparam("clusterer", "ping_timeout", 500)
modparam("clusterer", "node_timeout", 2)
modparam("dialog", "dialog_replication_cluster", 1)

route {
	if (has_totag()) {
		if (!loose_route()) {
			send_reply(404, "Not here");
			exit;
		}
		if (is_method("ACK")) {
			t_relay();
			exit;
		}
		if ($DLG_status == NULL && !match_dialog()) {
			xlog("L_ERR", "[$ci] $rm: no dialog\n");
			send_reply(481, "Call Leg/Transaction Does Not Exist");
			exit;
		}
		t_relay();
		exit;
	}
	if (is_method("INVITE")) {
		create_dialog();
		record_route();
		xlog("L_ERR", "[$ci] dialog $DLG_did\n");
		$du = "sip:UAS";
		t_relay();
		exit;
	}
	send_reply(405, "Method Not Allowed");
}
