# Minimal B2B config for test/rtp-relay-reverse-reinvite/run.sh: every initial
# INVITE becomes a B2B session towards the callee of check.py, with the media
# engaged through rtp_relay and the fake RTPEngine, as the SBC does.
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:127.0.0.1:5099

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "signaling.so"
loadmodule "sipmsgops.so"
loadmodule "uac_auth.so"
loadmodule "dialog.so"
loadmodule "b2b_entities.so"
loadmodule "b2b_logic.so"
modparam("b2b_logic", "script_req_route", "b2b_request")
modparam("b2b_logic", "script_reply_route", "b2b_reply")
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22299")
loadmodule "rtp_relay.so"

route {
	if (has_totag() || !is_method("INVITE")) {
		sl_send_reply(481, "Call Leg Does Not Exist");
		exit;
	}
	# flags for the offers of the caller, and for the offers of the callee
	$rtp_relay = "external internal replace-origin label=from-caller";
	$rtp_relay_peer = "internal external replace-origin label=from-callee";
	$rtp_relay_ctx(callid) = $ci;
	if (!rtp_relay_engage("rtpengine")) {
		sl_send_reply(503, "Media Server Unavailable");
		exit;
	}
	$ru = "sip:callee@127.0.0.1:5097";
	b2b_server_new("carrier");
	b2b_client_new("ims", $ru);
	b2b_init_request("rtpengine");
	exit;
}

route[b2b_request] {
	b2b_pass_request();
}

route[b2b_reply] {
	b2b_handle_reply();
}
