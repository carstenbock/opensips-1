# Minimal script for test/swap-msg-branches/run.sh: builds a Request-URI and
# two extra branches, each with an attribute, swaps them with
# swap_msg_branches() and answers with the resulting branches in headers.
#   Request-URI <-> branch (dst -1): this path read an uninitialised backup
#   branch and freed its attrs pointer (SIGBUS in the IPsec GW, 2026-11-11).
#   branch <-> branch: the original attrs of the source branch must be freed,
#   not leaked, and each side must keep its own attrs.
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:127.0.0.1:5299

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "sipmsgops.so"

route {
	$var(case) = $rU;
	$ru = "sip:ruri@127.0.0.1:5301";
	append_msg_branch("sip:b1@127.0.0.1:5302");
	append_msg_branch("sip:b2@127.0.0.1:5303");
	$(msg.branch.attr(who)[0]) = "attr-ruri";
	$(msg.branch.attr(who)[1]) = "attr-b1";
	$(msg.branch.attr(who)[2]) = "attr-b2";

	if ($var(case) == "ruri-swap") {
		# extra branch 1 (b2) <-> Request-URI
		swap_msg_branches(1);
	} else {
		# extra branch 0 (b1) <-> extra branch 1 (b2)
		swap_msg_branches(0, 1);
	}

	$var(i) = 0;
	while ($var(i) <= $msg.branch.last_idx) {
		append_to_reply("X-Branch-$var(i): $(msg.branch.uri[$var(i)]) $(msg.branch.attr(who)[$var(i)])\r\n");
		$var(i) = $var(i) + 1;
	}
	sl_send_reply(200, "OK");
	exit;
}
