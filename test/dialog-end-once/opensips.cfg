# Minimal proxy for test/dialog-end-by-val/run.sh: creates a dialog for every
# INVITE and tags it with the dialog value "served_aor" from the X-AoR header.
# A MESSAGE with "X-End: <aor>" ends that AoR's dialogs with
# dlg_end_dlgs_by_val(); with "X-Reason: yes" it passes a Reason header as
# extra headers, as the P-CSCF does after a media bearer loss.
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:127.0.0.1:5189

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "sipmsgops.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "dialog.so"

route {
	if (is_method("MESSAGE")) {
		$var(aor) = $hdr(X-End);
		if ($hdr(X-Reason) == "yes") {
			if (!dlg_end_dlgs_by_val("served_aor", $var(aor),
				"Reason: RELEASE_CAUSE;cause=3;text=\"Media bearer loss\"\r\n")) {
				sl_send_reply(500, "Refused");
				exit;
			}
		} else if ($hdr(X-Reason) == "bad") {
			if (!dlg_end_dlgs_by_val("served_aor", $var(aor), "Reason: no-crlf")) {
				sl_send_reply(500, "Refused");
				exit;
			}
		} else if (!dlg_end_dlgs_by_val("served_aor", $var(aor))) {
			sl_send_reply(500, "Refused");
			exit;
		}
		sl_send_reply(200, "Ended");
		exit;
	}
	if (has_totag()) {
		loose_route();
		t_relay();
		exit;
	}
	if (is_method("INVITE")) {
		record_route();
		create_dialog();
		$dlg_val(served_aor) = $hdr(X-AoR);
		$du = "sip:127.0.0.1:5188";
		t_relay();
	}
	exit;
}
