# Behaviour test for KI-152: the reg-event notifier of the S-CSCF reduced to
# usrloc + pua_reginfo + presence + presence_reginfo. REGISTER is handled as
# in route[aka_resume_sar] of the S-CSCF chart: reginfo_defer(), a save() per
# identity without a reply, the final save(), the identity key, then one
# reginfo_update(). Driven by check.py on 127.0.0.1.

log_level = 3
stderror_enabled = yes
syslog_enabled = no
udp_workers = 2

socket = udp:127.0.0.1:5460

mpath = "/usr/lib/x86_64-linux-gnu/opensips/modules"

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "mi_fifo.so"
loadmodule "db_text.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "presence.so"
loadmodule "presence_reginfo.so"
loadmodule "pua.so"
loadmodule "pua_reginfo.so"

modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")
modparam("presence|pua", "db_url", "text:///tmp/db")
# AoRs without the domain, as in the S-CSCF (registrar and pua_reginfo take
# the setting from usrloc): stated here, because upstream OpenSIPS 4.1
# changed the default of use_domain to 1
modparam("usrloc", "use_domain", 0)
modparam("pua_reginfo", "ul_domain", "location")
modparam("pua_reginfo", "ul_identities_key", "reginfo_identities")
modparam("pua_reginfo", "default_domain", "test")
modparam("pua_reginfo", "server_address", "sip:reginfo@127.0.0.1:5460")

route {
	if ($rm == "REGISTER") {
		reginfo_defer();
		# the per-identity save() of the S-CSCF; the registered AoR is one
		# of the identities
		save("location", "no-reply, max-contacts=1, force-registration", "sip:$tU@test");
		if (!save("location", "max-contacts=1, force-registration")) {
			sl_send_reply(500, "save failed");
			exit;
		}
		ul_add_key("location", "$tU", "reginfo_identities", "<sip:$tU@test>");
		reginfo_update("$tU");
		exit;
	}
	if ($rm == "SUBSCRIBE" && $hdr(Event) == "reg") {
		handle_subscribe();
		exit;
	}
	sl_send_reply(405, "Method Not Allowed");
}
