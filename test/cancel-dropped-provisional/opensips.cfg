# Minimal proxy for test/cancel-dropped-provisional/run.sh: the reply route
# cancels the branch of the first provisional reply and drops that reply, as
# the P-CSCF does when the PCRF refuses the media of a call being set up.
log_level=3
stderror_enabled=yes
udp_workers=1
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules"
socket=udp:127.0.0.1:5179

loadmodule "proto_udp.so"
loadmodule "sl.so"
loadmodule "sipmsgops.so"
loadmodule "tm.so"
# As in the charts: the reply route runs with the transaction's AVPs, under
# the reply lock.
modparam("tm", "onreply_avp_mode", 1)

route {
	if (is_method("INVITE") && !has_totag()) {
		t_on_reply("invite_reply");
		$du = "sip:127.0.0.1:5178";
		t_relay();
	} else if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
	}
	exit;
}

onreply_route[invite_reply] {
	if ($rs == 183) {
		t_cancel_branch();
		drop;
	}
}
